services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: time_deposits
      POSTGRES_USER: time_deposits
      POSTGRES_PASSWORD: time_deposits
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time_deposits -d time_deposits"]
      interval: 2s
      timeout: 5s
      retries: 20
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.30.2
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /contract/openapi.yaml
    volumes:
      - ./src/main/resources/openapi.yaml:/contract/openapi.yaml:ro
volumes:
  postgres-data:
